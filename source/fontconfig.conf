<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- OCCT's bundled Fontconfig needs only font directories: explicit font paths
       select the CAD label face, without depending on newer host alias syntax. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/equestria-cad-font-cache</cachedir>
</fontconfig>
